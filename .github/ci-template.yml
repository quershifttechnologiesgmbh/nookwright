# Zum Aktivieren nach .github/workflows/ci.yml kopieren. GitHub-Zugang braucht Workflow-Rechte.
name: Source CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:app
      - run: npm run typecheck:viewer
      - run: npm test
